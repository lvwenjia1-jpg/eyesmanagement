<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量词设置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        dark: '#0f172a',
                        success: '#16a34a',
                        danger: '#dc2626'
                    },
                    fontFamily: {
                        sans: ['Microsoft YaHei UI', 'PingFang SC', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="flex flex-col md:flex-row min-h-screen">
        <aside id="dashboardSidebar" class="bg-dark text-white w-full md:w-64 flex-shrink-0"></aside>

        <main class="flex-grow p-6">
            <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4 mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">量词设置</h2>
                    <p class="text-slate-600 mt-1">维护订单中“数字 + 量词”的实际数量换算规则。</p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <div class="text-sm text-slate-500 hidden md:block">
                        当前登录：<span id="currentLoginName" class="font-medium text-slate-700">-</span>
                    </div>
                    <button id="addBtn" type="button" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-md text-sm shadow-sm">
                        <i class="fa fa-plus mr-2"></i>新增量词
                    </button>
                    <button id="saveBtn" type="button" class="bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-md shadow-sm">
                        <i class="fa fa-save mr-2"></i>保存设置
                    </button>
                </div>
            </div>

            <section class="bg-white rounded-lg shadow overflow-hidden">
                <div class="px-5 py-4 border-b border-slate-200">
                    <h3 class="text-lg font-semibold text-slate-800">量词规则</h3>
                    <p class="text-sm text-slate-500 mt-1">实际数量用于订单、价格计算和上传数量。例如“副”设置为 2 时，输入“3副”会按 6 件处理。</p>
                </div>
                <div class="p-5 overflow-x-auto">
                    <table class="min-w-full divide-y divide-slate-200">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="w-24 px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">排序</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">量词</th>
                                <th class="w-56 px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">实际数量</th>
                                <th class="w-28 px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="bg-white divide-y divide-slate-200"></tbody>
                    </table>
                </div>
            </section>

            <section class="bg-blue-50 border border-blue-100 rounded-lg p-5 mt-6 text-sm text-slate-700 leading-7">
                <div class="font-semibold text-slate-800 mb-2">使用规则</div>
                <div>1. 明确写出数字和量词时，优先按此处设置换算，例如“*3片”“3副”。</div>
                <div>2. “2片装”属于包装规格，不会按本页规则换算。</div>
                <div>3. 未写明确数量时，继续使用历史数量识别逻辑。</div>
            </section>
        </main>
    </div>

    <script src="dashboard-common.js"></script>
    <script src="quantity-unit-settings-api.js"></script>
</body>
</html>

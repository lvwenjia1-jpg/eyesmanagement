<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品编码管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        dark: '#0f172a',
                        success: '#16a34a',
                        danger: '#dc2626',
                        warning: '#d97706'
                    },
                    fontFamily: {
                        sans: ['Microsoft YaHei UI', 'PingFang SC', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .transition-all {
                transition-property: all;
                transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
                transition-duration: 200ms;
            }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="flex flex-col md:flex-row min-h-screen">
        <aside id="dashboardSidebar" class="bg-dark text-white w-full md:w-64 flex-shrink-0"></aside>

        <main class="flex-grow p-6">
            <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4 mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">商品编码管理</h2>
                    <p class="text-slate-600 mt-1">按周期 + 型号查看度数。导入识别会优先使用“周期设置”里的标准周期和别名规则。</p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <div class="text-sm text-slate-500 hidden md:block">
                        当前登录：<span id="currentLoginName" class="font-medium text-slate-700">-</span>
                    </div>
                    <input type="file" id="importExcelInput" accept=".xlsx,.xls,.csv" class="hidden">
                    <input type="file" id="incrementalImportInput" accept=".xlsx,.xls,.csv" class="hidden">
                    <input type="file" id="stockOutImportInput" accept=".xlsx,.xls,.csv" class="hidden">
                    <input type="file" id="stockInImportInput" accept=".xlsx,.xls,.csv" class="hidden">
                    <datalist id="specificationTokenOptions"></datalist>
                    <button id="downloadTemplateBtn" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 px-4 py-2 rounded-md flex items-center transition-all shadow-sm">
                        <i class="fa fa-file-excel-o mr-2"></i>下载模板
                    </button>
                    <button id="importBtn" class="bg-success hover:bg-green-700 text-white px-4 py-2 rounded-md flex items-center transition-all shadow-sm">
                        <i class="fa fa-upload mr-2"></i>覆盖导入
                    </button>
                    <button id="incrementalImportBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md flex items-center transition-all shadow-sm">
                        <i class="fa fa-plus-circle mr-2"></i>增量导入
                    </button>
                    <button id="stockOutImportBtn" class="bg-warning hover:bg-amber-700 text-white px-4 py-2 rounded-md flex items-center transition-all shadow-sm">
                        <i class="fa fa-ban mr-2"></i>缺货导入
                    </button>
                    <button id="stockInImportBtn" class="bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-md flex items-center transition-all shadow-sm">
                        <i class="fa fa-check-circle mr-2"></i>到货导入
                    </button>
                    <button id="addBtn" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-md flex items-center transition-all shadow-sm">
                        <i class="fa fa-plus mr-2"></i>新增商品编码
                    </button>
                    <button id="exportBtn" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 px-4 py-2 rounded-md flex items-center transition-all shadow-sm">
                        <i class="fa fa-download mr-2"></i>导出目录
                    </button>
                </div>
            </div>

            <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-white rounded-lg shadow p-5">
                    <div class="text-sm text-slate-500">当前页分组数</div>
                    <div id="pageCountCard" class="text-3xl font-bold text-slate-800 mt-2">0</div>
                </div>
                <div class="bg-white rounded-lg shadow p-5">
                    <div class="text-sm text-slate-500">分组总数</div>
                    <div id="totalCountCard" class="text-3xl font-bold text-primary mt-2">0</div>
                </div>
                <div class="bg-white rounded-lg shadow p-5">
                    <div class="text-sm text-slate-500">当前页度数总条目</div>
                    <div id="totalDegreeCountCard" class="text-3xl font-bold text-slate-800 mt-2">0</div>
                </div>
            </section>

            <section class="bg-white p-4 rounded-lg shadow mb-6">
                <div class="grid grid-cols-1 lg:grid-cols-5 gap-4">
                    <div class="lg:col-span-2">
                        <label for="keywordInput" class="block text-sm font-medium text-slate-700 mb-1">综合搜索</label>
                        <input type="text" id="keywordInput" placeholder="可搜索编码、条码、周期、型号、度数"
                               class="w-full px-4 py-2 border rounded-md border-slate-300 focus:ring-2 focus:ring-primary focus:border-transparent">
                    </div>
                    <div>
                        <label for="specificationTokenInput" class="block text-sm font-medium text-slate-700 mb-1">周期</label>
                        <input type="text" id="specificationTokenInput" list="specificationTokenOptions" placeholder="如：日抛2片"
                               class="w-full px-4 py-2 border rounded-md border-slate-300 focus:ring-2 focus:ring-primary focus:border-transparent">
                    </div>
                    <div>
                        <label for="modelTokenInput" class="block text-sm font-medium text-slate-700 mb-1">型号</label>
                        <input type="text" id="modelTokenInput" placeholder="如：星辰泪灰"
                               class="w-full px-4 py-2 border rounded-md border-slate-300 focus:ring-2 focus:ring-primary focus:border-transparent">
                    </div>
                    <div>
                        <label for="degreeInput" class="block text-sm font-medium text-slate-700 mb-1">度数</label>
                        <input type="text" id="degreeInput" placeholder="如：350"
                               class="w-full px-4 py-2 border rounded-md border-slate-300 focus:ring-2 focus:ring-primary focus:border-transparent">
                    </div>
                </div>
                <div class="flex flex-wrap items-center gap-3 mt-4">
                    <button id="searchBtn" class="bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-md transition-all">
                        <i class="fa fa-search mr-2"></i>查询
                    </button>
                    <button id="resetBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-4 py-2 rounded-md transition-all">
                        <i class="fa fa-refresh mr-2"></i>重置
                    </button>
                    <a href="settings.html" class="text-sm text-primary hover:text-blue-700">去维护周期列表和周期对照表</a>
                </div>
            </section>

            <section class="bg-white rounded-lg shadow overflow-hidden">
                <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
                    <div class="text-sm text-slate-600">商品编码列表（按周期 + 型号聚合）</div>
                    <div id="loadingHint" class="text-sm text-slate-400 hidden">正在加载...</div>
                </div>
                <div class="p-4 text-sm text-slate-600 border-b border-slate-100">
                    原始商品编码保持不变；周期识别会统一按服务器规则归一化，例如“日抛两片”会收敛到“日抛2片”。
                </div>
                <div class="grid grid-cols-1 xl:grid-cols-12 gap-4 p-4">
                    <div class="xl:col-span-6 border border-slate-200 rounded-lg overflow-hidden">
                        <table class="min-w-full divide-y divide-slate-200">
                            <thead class="bg-slate-50">
                                <tr>
                                    <th class="w-24 px-3 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider whitespace-nowrap">周期</th>
                                    <th class="px-3 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">型号</th>
                                    <th class="w-32 px-3 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider whitespace-nowrap">更新时间</th>
                                </tr>
                            </thead>
                            <tbody id="catalogGroupTableBody" class="bg-white divide-y divide-slate-200"></tbody>
                        </table>
                    </div>
                    <div class="xl:col-span-6 border border-slate-200 rounded-lg overflow-hidden">
                        <div class="px-4 py-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between gap-3">
                            <div class="text-sm font-semibold text-slate-700">
                                <div id="catalogDetailTitle">度数明细</div>
                                <div class="mt-2 flex flex-wrap items-center gap-2">
                                    <select id="groupSpecificationSelect" class="px-3 py-1.5 border border-slate-300 rounded-md text-xs text-slate-700 bg-white min-w-[120px]">
                                        <option value="">选择周期</option>
                                    </select>
                                    <button id="saveGroupSpecificationBtn" type="button" class="bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 px-3 py-1.5 rounded-md text-xs transition-all">
                                        保存周期
                                    </button>
                                    <button id="deleteGroupBtn" type="button" class="bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 px-3 py-1.5 rounded-md text-xs transition-all">
                                        删除型号
                                    </button>
                                </div>
                            </div>
                            <button id="addDegreeBtn" type="button" class="bg-primary hover:bg-blue-700 text-white px-3 py-1.5 rounded-md text-xs transition-all">
                                <i class="fa fa-plus mr-1"></i>新增度数
                            </button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-slate-200">
                                <thead class="bg-slate-50">
                                    <tr>
                                        <th class="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">度数</th>
                                        <th class="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">商品编码</th>
                                        <th class="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">条码</th>
                                        <th class="w-28 px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider whitespace-nowrap">是否缺货</th>
                                        <th class="w-56 px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider whitespace-nowrap">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="catalogDegreeTableBody" class="bg-white divide-y divide-slate-200"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="bg-white px-4 py-3 border-t border-slate-200">
                    <div class="flex flex-col gap-3 sm:hidden">
                        <div id="mobilePageInfo" class="text-sm text-slate-700"></div>
                        <div class="flex justify-between">
                            <button id="mobilePrevBtn" class="relative inline-flex items-center px-4 py-2 border border-slate-300 text-sm font-medium rounded-md text-slate-700 bg-white hover:bg-slate-50">上一页</button>
                            <button id="mobileNextBtn" class="relative inline-flex items-center px-4 py-2 border border-slate-300 text-sm font-medium rounded-md text-slate-700 bg-white hover:bg-slate-50">下一页</button>
                        </div>
                    </div>
                    <div class="hidden sm:flex sm:items-center sm:justify-between">
                        <div id="pageInfo" class="text-sm text-slate-700"></div>
                        <div id="pagination"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-2xl">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h3 id="modalTitle" class="text-lg font-bold text-slate-800">新增商品编码</h3>
                    <p class="text-sm text-slate-500 mt-1">按周期 + 型号 + 度数录入，系统自动生成编码名称。</p>
                </div>
                <button id="closeModalBtn" class="text-slate-500 hover:text-slate-700">
                    <i class="fa fa-times"></i>
                </button>
            </div>

            <form id="editForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="inputSpecificationToken" class="block text-sm font-medium text-slate-700 mb-1">周期</label>
                        <input type="text" id="inputSpecificationToken" list="specificationTokenOptions" placeholder="如：日抛2片"
                               class="w-full px-4 py-2 border rounded-md border-slate-300 focus:ring-2 focus:ring-primary focus:border-transparent">
                    </div>
                    <div>
                        <label for="inputModelToken" class="block text-sm font-medium text-slate-700 mb-1">型号</label>
                        <input type="text" id="inputModelToken" placeholder="如：星辰泪灰"
                               class="w-full px-4 py-2 border rounded-md border-slate-300 focus:ring-2 focus:ring-primary focus:border-transparent">
                    </div>
                    <div>
                        <label for="inputDegree" class="block text-sm font-medium text-slate-700 mb-1">度数</label>
                        <textarea id="inputDegree" rows="4" placeholder="支持批量输入，如：350, 375, 400 或每行一个度数"
                                  class="w-full px-4 py-2 border rounded-md border-slate-300 focus:ring-2 focus:ring-primary focus:border-transparent"></textarea>
                    </div>
                </div>

                <div>
                    <label for="inputBarcode" class="block text-sm font-medium text-slate-700 mb-1">条码（选填）</label>
                    <input type="text" id="inputBarcode" placeholder="可空"
                           class="w-full px-4 py-2 border rounded-md border-slate-300 focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>

                <div class="bg-blue-50 border border-blue-100 rounded-lg p-4 text-sm text-slate-700">
                    新增时按“周期 + 型号 + 度数”自动生成编码名称；度数支持逗号、顿号、分号、空格或换行批量输入。
                </div>

                <div class="flex justify-end">
                    <button type="button" id="cancelBtn" class="bg-slate-300 hover:bg-slate-400 text-slate-800 px-4 py-2 rounded-md mr-2 transition-all">取消</button>
                    <button type="submit" class="bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-md transition-all">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="dashboard-common.js"></script>
    <script src="product-catalog-api.js"></script>
</body>
</html>

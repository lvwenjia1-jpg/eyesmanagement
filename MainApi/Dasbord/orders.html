<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        success: '#22c55e',
                        danger: '#ef4444',
                        warning: '#f59e0b',
                        info: '#0ea5e9',
                        light: '#f8fafc',
                        dark: '#1e293b'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .transition-all {
                transition-property: all;
                transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
                transition-duration: 300ms;
            }
            .shadow-hover {
                @apply transition-all duration-300;
            }
            .shadow-hover:hover {
                @apply shadow-lg transform -translate-y-1;
            }
            .readonly-field {
                @apply bg-gray-100 text-gray-700 cursor-not-allowed border-gray-300;
            }
            .editable-field {
                @apply bg-white text-gray-900 border-gray-300 focus:ring-2 focus:ring-primary focus:border-transparent;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="flex flex-col md:flex-row min-h-screen">
        <!-- 侧边栏 -->
        <aside id="dashboardSidebar" class="bg-dark text-white w-full md:w-64 flex-shrink-0"></aside>

        <!-- 主内容区 -->
        <main class="flex-grow p-6">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <button id="backBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-md flex items-center mb-2 transition-all">
                        <i class="fa fa-arrow-left mr-2"></i> 返回
                    </button>
                    <h2 class="text-2xl font-bold text-gray-800" id="groupTitle">订单详情</h2>
                </div>
                <div class="flex items-center">
                    <span class="text-gray-600 mr-2">今日日期:</span>
                    <span class="font-medium" id="currentDate"></span>
                </div>
            </div>

            <!-- 筛选和导出 -->
            <div class="bg-white p-4 rounded-lg shadow mb-6">
                <div class="flex flex-col md:flex-row gap-4 items-end">
                    <div>
                        <label for="startTime" class="block text-sm font-medium text-gray-700 mb-1">开始时间</label>
                        <input type="datetime-local" id="startTime" 
                            class="px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                    <div>
                        <label for="endTime" class="block text-sm font-medium text-gray-700 mb-1">结束时间</label>
                        <input type="datetime-local" id="endTime" 
                            class="px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                    <div>
                        <label for="orderNo" class="block text-sm font-medium text-gray-700 mb-1">订单号</label>
                        <input type="text" id="orderNo"
                            class="px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary"
                            placeholder="订单号完全匹配">
                    </div>
                    <div>
                        <label for="receiverName" class="block text-sm font-medium text-gray-700 mb-1">收件人</label>
                        <input type="text" id="receiverName"
                            class="px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary"
                            placeholder="收件人模糊查询">
                    </div>
                    <div class="flex items-center pb-2">
                        <label class="inline-flex items-center text-sm text-gray-700">
                            <input type="checkbox" id="hasTrackingNumberOnly" class="mr-2 h-4 w-4">
                            存在快递单号
                        </label>
                    </div>
                    <div class="flex items-center pb-2">
                        <label class="inline-flex items-center text-sm text-gray-700">
                            <input type="checkbox" id="includeCancelledOrders" class="mr-2 h-4 w-4" checked>
                            是否包含订单已取消
                        </label>
                    </div>
                    <button id="filterBtn" class="bg-primary hover:bg-blue-600 text-white px-4 py-2 rounded-md transition-all">
                        <i class="fa fa-filter mr-2"></i> 筛选
                    </button>
                    <button id="resetBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-md transition-all">
                        <i class="fa fa-refresh mr-2"></i> 重置
                    </button>
                    <button id="syncTrackingBtn" class="bg-info hover:bg-sky-600 text-white px-4 py-2 rounded-md transition-all">
                        <i class="fa fa-truck mr-2"></i> 同步快递单号
                    </button>
                </div>
            </div>

            <div class="bg-white p-4 rounded-lg shadow mb-6">
                <div class="flex flex-wrap items-center gap-3 text-sm text-gray-600">
                    <span class="font-medium text-gray-800">颜色说明</span>
                    <span class="inline-flex items-center rounded-md bg-amber-50 px-2 py-0.5 text-amber-700 font-medium">价格多付</span>
                    <span class="inline-flex items-center rounded-md bg-rose-50 px-2 py-0.5 text-rose-700 font-medium">清仓</span>
                    <span class="inline-flex items-center rounded-md bg-red-50 px-2 py-0.5 text-red-700 font-medium">订单已取消</span>
                    <span id="legendTotalCount" class="ml-auto text-sm font-medium text-slate-700">共 0 条记录</span>
                    <button id="exportBtn" class="bg-success hover:bg-green-600 text-white px-4 py-2 rounded-md transition-all">
                        <i class="fa fa-download mr-2"></i> 导出
                    </button>
                </div>
            </div>

            <!-- 订单表格 -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    订单ID
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    上传人账号
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    收件人
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    收货地址
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    产品信息
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    订单状态
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    订单金额
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    快递单号
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    操作
                                </th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- 订单数据将通过JavaScript动态填充 -->
                        </tbody>
                    </table>
                </div>
                <div class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6">
                    <div class="flex-1 flex justify-between sm:hidden">
                        <button id="mobilePrevBtn" class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                            上一页
                        </button>
                        <button id="mobileNextBtn" class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                            下一页
                        </button>
                    </div>
                    <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                        <div id="pageInfo">
                            <p class="text-sm text-gray-700">
                                显示 <span class="font-medium">0</span> 到 <span class="font-medium">0</span> 条，共 <span class="font-medium">0</span> 条记录
                            </p>
                        </div>
                        <div id="pagination"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 编辑订单模态框 -->
    <div id="orderModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-50 px-4 py-6">
        <div class="flex max-h-[90vh] w-full max-w-5xl flex-col overflow-hidden rounded-xl bg-white shadow-xl">
            <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4">
                <h3 class="text-lg font-bold text-gray-800">编辑订单</h3>
                <button id="closeOrderModal" class="text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <form id="orderForm" class="flex min-h-0 flex-1 flex-col">
                <input type="hidden" id="orderId">
                <div class="min-h-0 flex-1 overflow-y-auto px-6 py-5">
                    <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
                        <div>
                        <label for="editOrderId" class="block text-sm font-medium text-gray-700 mb-1">订单ID</label>
                        <input type="text" id="editOrderId" readonly
                            class="w-full px-4 py-2 border rounded-md readonly-field">
                        </div>
                        <div>
                        <label for="editUploader" class="block text-sm font-medium text-gray-700 mb-1">上传人账号</label>
                        <input type="text" id="editUploader" readonly
                            class="w-full px-4 py-2 border rounded-md readonly-field">
                        </div>
                        <div>
                        <label for="editRecipient" class="block text-sm font-medium text-gray-700 mb-1">收件人</label>
                        <input type="text" id="editRecipient" name="recipient" required readonly
                            class="w-full px-4 py-2 border rounded-md readonly-field">
                        </div>
                        <div class="md:col-span-3">
                        <label for="editAddress" class="block text-sm font-medium text-gray-700 mb-1">收货地址</label>
                        <input type="text" id="editAddress" name="address" required
                            class="w-full px-4 py-2 border rounded-md editable-field">
                        </div>
                    </div>

                    <div class="mt-5">
                        <div class="mb-2 flex items-center justify-between gap-3">
                            <label class="block text-sm font-medium text-gray-700">产品信息</label>
                            <span id="editProductsHint" class="text-xs text-slate-500">商品过多时支持滚动查看</span>
                        </div>
                        <div id="productsContainer" class="max-h-[360px] overflow-y-auto rounded-lg border border-slate-200 bg-slate-50 p-4">
                            <!-- 产品信息将通过JavaScript动态填充 -->
                        </div>
                    </div>

                    <div class="mt-5 flex flex-col gap-4 md:flex-row">
                        <div class="md:w-40">
                        <label for="editAmount" class="block text-sm font-medium text-gray-700 mb-1">订单金额</label>
                        <input type="number" id="editAmount" name="amount" required min="0" step="0.01"
                            class="w-full px-4 py-2 border rounded-md editable-field">
                        </div>
                        <div class="md:flex-1">
                        <label for="editTrackingNumber" class="block text-sm font-medium text-gray-700 mb-1">快递单号</label>
                        <input type="text" id="editTrackingNumber" name="trackingNumber" readonly
                            class="w-full px-4 py-2 border rounded-md readonly-field">
                        </div>
                        <div class="md:flex-1">
                        <label for="editReceiverMobile" class="block text-sm font-medium text-gray-700 mb-1">手机号</label>
                        <input type="text" id="editReceiverMobile" name="receiverMobile" required
                            class="w-full px-4 py-2 border rounded-md editable-field">
                        </div>
                    </div>
                </div>
                <div class="flex justify-end border-t border-slate-200 bg-slate-50 px-6 py-4">
                    <button type="button" id="cancelOrderBtn" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-md mr-2 transition-all">
                        取消
                    </button>
                    <button type="submit" id="saveOrderBtn" class="bg-primary hover:bg-blue-600 text-white px-4 py-2 rounded-md transition-all">
                        保存
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="productsDetailModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-50 px-4 py-6">
        <div class="flex max-h-[90vh] w-full max-w-4xl flex-col overflow-hidden rounded-xl bg-white shadow-xl">
            <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4">
                <div>
                    <h3 id="productsDetailTitle" class="text-lg font-bold text-gray-800">商品详情</h3>
                    <p class="mt-1 text-sm text-slate-500">以下为该订单的全部商品，颜色逻辑与列表保持一致。</p>
                </div>
                <button id="closeProductsDetailModal" class="text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div id="productsDetailContainer" class="min-h-0 flex-1 overflow-y-auto bg-slate-50 px-6 py-5">
            </div>
            <div class="flex justify-end border-t border-slate-200 bg-white px-6 py-4">
                <button type="button" id="closeProductsDetailFooterBtn" class="rounded-md bg-primary px-4 py-2 text-white hover:bg-blue-600">
                    关闭
                </button>
            </div>
        </div>
    </div>

    <script src="dashboard-common.js?v=20260601a"></script>
    <script src="orders-api.js?v=20260601a"></script>
</body>
</html>

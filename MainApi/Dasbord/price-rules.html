<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>价格规则管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        dark: '#0f172a'
                    },
                    fontFamily: {
                        sans: ['Microsoft YaHei UI', 'Microsoft YaHei', 'Segoe UI', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="flex flex-col md:flex-row min-h-screen">
        <aside id="dashboardSidebar" class="bg-dark text-white w-full md:w-64 flex-shrink-0"></aside>

        <main class="flex-grow p-6">
            <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4 mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">价格规则管理</h2>
                    <p class="text-slate-600 mt-1">
                        价格规则现分为三类：价格周期单副价、价格周期多付活动、清仓规则。价格周期独立于识别周期，默认继承商品周期。
                    </p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <div class="text-sm text-slate-500 hidden md:block">
                        当前登录：<span id="currentLoginName" class="font-medium text-slate-700">-</span>
                    </div>
                    <input type="file" id="importExcelInput" accept=".xlsx,.xls,.csv" class="hidden">
                    <button id="downloadTemplateBtn" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 px-4 py-2 rounded-md shadow-sm">
                        <i class="fa fa-download mr-2"></i>下载模板
                    </button>
                    <button id="importExcelBtn" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 px-4 py-2 rounded-md shadow-sm">
                        <i class="fa fa-upload mr-2"></i>导入 Excel
                    </button>
                    <button id="addPriceRuleBtn" class="bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-md shadow-sm">
                        <i class="fa fa-plus mr-2"></i>新增规则
                    </button>
                </div>
            </div>

            <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-white rounded-lg shadow p-5">
                    <div class="text-sm text-slate-500">当前页规则数</div>
                    <div id="pageCountCard" class="text-3xl font-bold text-slate-800 mt-2">0</div>
                </div>
                <div class="bg-white rounded-lg shadow p-5">
                    <div class="text-sm text-slate-500">规则总数</div>
                    <div id="totalCountCard" class="text-3xl font-bold text-primary mt-2">0</div>
                </div>
                <div class="bg-white rounded-lg shadow p-5">
                    <div class="text-sm text-slate-500">当前筛选</div>
                    <div id="filterSummaryCard" class="text-base font-semibold text-slate-800 mt-2">全部规则</div>
                </div>
            </section>

            <section class="bg-white p-4 rounded-lg shadow mb-6">
                <div class="flex flex-col xl:flex-row gap-4">
                    <div class="flex-1">
                        <label for="searchInput" class="block text-sm font-medium text-slate-700 mb-1">查询内容</label>
                        <input type="text"
                               id="searchInput"
                               placeholder="可搜索规则类型、周期、型号或规则名称"
                               class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                    <div class="flex items-end gap-3">
                        <button id="searchBtn" class="bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-md">查询</button>
                        <button id="resetBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-4 py-2 rounded-md">重置</button>
                    </div>
                </div>
            </section>

            <section class="bg-white rounded-lg shadow overflow-hidden">
                <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
                    <div class="text-sm text-slate-600">价格规则列表</div>
                    <div id="loadingHint" class="text-sm text-slate-400 hidden">正在加载...</div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-slate-200">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">ID</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">类型</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">周期</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">型号集合</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">整包数量</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">价格</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">更新时间</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="priceRulesTableBody" class="bg-white divide-y divide-slate-200"></tbody>
                    </table>
                </div>
                <div class="bg-white px-4 py-3 border-t border-slate-200">
                    <div class="flex flex-col gap-3 sm:hidden">
                        <div id="mobilePageInfo" class="text-sm text-slate-700"></div>
                        <div class="flex justify-between">
                            <button id="mobilePrevBtn" class="px-4 py-2 border border-slate-300 text-sm rounded-md text-slate-700 bg-white">上一页</button>
                            <button id="mobileNextBtn" class="px-4 py-2 border border-slate-300 text-sm rounded-md text-slate-700 bg-white">下一页</button>
                        </div>
                    </div>
                    <div class="hidden sm:flex sm:items-center sm:justify-between">
                        <div id="pageInfo" class="text-sm text-slate-700"></div>
                        <div id="pagination"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="priceRuleModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h3 id="modalTitle" class="text-lg font-bold text-slate-800">新增价格规则</h3>
                    <p id="priceRuleFormHint" class="text-sm text-slate-500 mt-1">基础单价按周期统一生效，不再区分型号。</p>
                </div>
                <button id="closeModal" class="text-slate-500 hover:text-slate-700">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <form id="priceRuleForm" novalidate>
                <input type="hidden" id="priceRuleId">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label for="ruleType" class="block text-sm font-medium text-slate-700 mb-1">规则类型</label>
                        <select id="ruleType" class="w-full px-4 py-2 border rounded-md">
                            <option value="base">单副价</option>
                            <option value="bulk">多付活动</option>
                            <option value="clearance">清仓规则</option>
                        </select>
                    </div>
                    <div>
                        <label for="wearPeriod" class="block text-sm font-medium text-slate-700 mb-1">价格周期</label>
                        <select id="wearPeriod" class="w-full px-4 py-2 border rounded-md"></select>
                    </div>
                </div>

                <div id="modelField" class="mb-4 hidden">
                    <label class="block text-sm font-medium text-slate-700 mb-1">型号集合</label>
                    <div class="relative">
                        <button type="button" id="modelDropdownBtn" class="w-full px-4 py-2 border rounded-md bg-white text-left flex items-center justify-between">
                            <span id="modelSelectionSummary" class="text-slate-500">请先选择周期</span>
                            <i class="fa fa-angle-down text-slate-400"></i>
                        </button>
                        <div id="modelDropdownPanel" class="hidden absolute z-20 mt-2 w-full rounded-md border border-slate-200 bg-white shadow-lg">
                            <div class="flex items-center justify-between px-3 py-2 border-b border-slate-100 bg-slate-50">
                                <button type="button" id="selectAllModelsBtn" class="text-sm text-primary hover:text-blue-700">全选</button>
                                <button type="button" id="clearModelsBtn" class="text-sm text-slate-500 hover:text-slate-700">清空</button>
                            </div>
                            <div id="modelOptionsList" class="max-h-64 overflow-y-auto py-2"></div>
                        </div>
                    </div>
                    <p class="text-xs text-slate-500 mt-2">支持批量选择多个型号，命中的型号会共用同一条清仓整包规则。</p>
                </div>

                <div id="quantityField" class="mb-4 hidden">
                    <label for="requiredQuantity" class="block text-sm font-medium text-slate-700 mb-1">整包数量</label>
                    <input type="number" id="requiredQuantity" min="1" step="1" class="w-full px-4 py-2 border rounded-md">
                </div>

                <div id="priceField" class="mb-6">
                    <label for="priceValue" id="priceValueLabel" class="block text-sm font-medium text-slate-700 mb-1">价格</label>
                    <input type="number" id="priceValue" min="0" step="1" class="w-full px-4 py-2 border rounded-md">
                </div>

                <div class="flex justify-end">
                    <button type="button" id="cancelBtn" class="bg-slate-300 hover:bg-slate-400 text-slate-800 px-4 py-2 rounded-md mr-2">取消</button>
                    <button type="submit" class="bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-md">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="dashboard-common.js"></script>
    <script src="price-rules-api.js"></script>
</body>
</html>
